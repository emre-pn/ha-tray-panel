# Ev Paneli — electron-builder ayarı
# Komut: npm run dist  ->  dist\Ev-Paneli-Kurulum-<sürüm>.exe
# Taşınabilir derleme: npm run dist:tasinabilir  ->  dist\Ev-Paneli-Tasinabilir-<sürüm>.exe (aşağıdaki `portable` bloğu)

appId: io.github.emre-pn.evpaneli          # src/main.js içindeki UYGULAMA_KIMLIGI ile aynı olmalı
productName: Ev Paneli
copyright: Copyright © 2026 Emre Sav

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - assets/**/*
  - varsayilan-ayarlar.json
  - package.json
  - CHANGELOG.md   # "Yenilikler" (o-40): uygulama çalışan sürümün notlarını bu dosyadan gösterir (ağ yok)

asar: true

# Electron sertleştirme anahtarları (fuse; 1.2.0, k-21). electron-builder 26 `electronFuses` ile paketlerken @electron/fuses'a
# iletir; YALNIZ yazılan anahtarlar değiştirilir, gerisi Electron varsayılanında kalır. Uygulama ELECTRON_RUN_AS_NODE, NODE_OPTIONS
# ve --inspect kullanmaz: bu üç kapı kapatılır (kurulu exe başka bir program tarafından Node yorumlayıcısı ya da hata ayıklanabilir
# süreç olarak kullanılamaz). Çerez şifreleme, asar bütünlüğü, OnlyLoadAppFromAsar ve GrantFileProtocolExtraPrivileges bilerek
# ayarlanmadı (ayrı karar ve deneme gerekir). Yalnız `npm run dist` çıktısını etkiler; `npm start` (geliştirme) değişmez.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/ikon.ico
  artifactName: Ev-Paneli-Kurulum-${version}.${ext}

# Taşınabilir Windows derlemesi (o-45): kurulum gerektirmez; exe her açılışta kendini geçici klasöre açar, çalışır, kapanınca siler.
# Yalnız `npm run dist:tasinabilir` ile derlenir (win.target listesinde DEĞİL: `npm run dist` yine yalnız kurucuyu üretir).
#  - Ayarlar, anahtar ve HA oturumu kurulu sürümle AYNI klasördedir (%APPDATA%\Ev Paneli); tek kopya kilidi de ortaktır.
#    Taşınabilir sürümü açarken kurulu sürüm çalışıyorsa yeni kopya açılmaz, çalışan pencere öne gelir.
#  - "Windows açılınca başlat" taşınabilir sürümde YOKTUR: geçici klasördeki exe'yi kayıt defterine yazmak anlamsızdır (src/main.js tasinabilirMi).
#  - unpackDirName: false -> her açılış kendine özgü geçici klasör kullanır; ikinci bir açılış (ör. --eylem) çalışan kopyanın dosyalarına çarpmaz.
#  - Komut satırı bağımsız değişkenleri (--eylem, --goster, --durum...) açılış yardımcısı tarafından uygulamaya aktarılır, ama her çağrı exe'yi
#    yeniden açtığı için kurulu sürümden belirgin biçimde yavaştır.
portable:
  artifactName: Ev-Paneli-Tasinabilir-${version}.${ext}
  requestExecutionLevel: user
  unpackDirName: false

nsis:
  # Tek tıkla, kullanıcı başına kurulum: %LOCALAPPDATA%\Programs\ altına kurar, yönetici izni istemez.
  oneClick: true
  perMachine: false
  createStartMenuShortcut: true
  createDesktopShortcut: false
  shortcutName: Ev Paneli
  menuCategory: false
  runAfterFinish: true
  # Kaldırırken ayarlar ve HA oturumu silinmez (yeniden kurulumda giriş korunur). README'ye bakın.
  deleteAppDataOnUninstall: false
  # Gerçek kaldırmada Windows otomatik başlatma kaydını da temizler; güncellemede dokunmaz (build/installer.nsh).
  include: build/installer.nsh
