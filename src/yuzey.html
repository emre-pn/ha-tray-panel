<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title data-i18n="yuzey.sayfaBasligi">Ev Paneli — Hızlı Panel</title>
  <link rel="stylesheet" href="yuzey.css">
</head>
<body class="mod-panel">
  <div id="kok" class="kok">
    <header id="ust" class="ust">
      <span id="baslik" class="baslik" data-i18n="yuzey.uygulamaAdi">Ev Paneli</span>
      <span id="medya" class="medya" hidden></span>
      <span id="baglanti" class="baglanti" role="status"></span>
      <button id="sabitle" class="sabitle" type="button" aria-pressed="false" data-i18n-attr="title:yuzey.sabit.ac;aria-label:yuzey.sabit.ac" title="Paneli sabitle" aria-label="Paneli sabitle"><svg class="sabitle-simge" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5h6l-1 5.5 3 3H7l3-3z" fill="currentColor" fill-opacity="0.2"/><path d="M12 12v8.5"/></svg></button>
      <span id="eski" class="eski" data-i18n="yuzey.eskiRozeti" hidden>Durumlar eski olabilir</span>
    </header>

    <section id="disOnay" class="dis-onay" role="alertdialog" aria-labelledby="disOnayBaslik" aria-describedby="disOnaySoru disOnayIslem" hidden>
      <h2 id="disOnayBaslik" class="dis-onay-baslik" data-i18n="yuzey.disOnay.baslik">Bağlantı izni</h2>
      <p id="disOnaySoru" class="dis-onay-soru"></p>
      <p id="disOnayIslem" class="dis-onay-islem"></p>
      <p class="dis-onay-ayrinti" data-i18n="yuzey.disOnay.ayrinti">İzin yalnız bu favori için geçerlidir. “Her zaman” izni Ayarlar’daki Dış tetikler bölümünden kaldırılabilir.</p>
      <div class="dis-onay-dugmeler">
        <button id="disOnayIzin" class="dis-onay-dugme" type="button" data-i18n="yuzey.disOnay.izin" disabled>İzin ver</button>
        <button id="disOnayHerZaman" class="dis-onay-dugme" type="button" data-i18n="yuzey.disOnay.herZaman" disabled>Her zaman</button>
        <button id="disOnayReddet" class="dis-onay-dugme" type="button" data-i18n="yuzey.disOnay.reddet">Reddet</button>
      </div>
    </section>

    <div id="serit" class="serit" role="status" aria-live="polite" hidden></div>

    <section id="hero" class="hero" data-i18n-attr="aria-label:yuzey.hero.etiket" aria-label="Özet" hidden></section>

    <section id="bildirim" class="bildirim" aria-labelledby="bildirimBaslik" hidden>
      <button id="bildirimDugme" class="bildirim-dugme" type="button" aria-expanded="false" aria-controls="bildirimListe">
        <span class="bildirim-zil" aria-hidden="true">🔔</span>
        <span id="bildirimBaslik" class="bildirim-baslik" data-i18n="yuzey.bildirim.baslik">Bildirimler</span>
        <span id="bildirimSayi" class="bildirim-rozet" hidden></span>
        <span id="bildirimOzet" class="bildirim-ozet"></span>
        <span class="bildirim-ok" aria-hidden="true">▾</span>
      </button>
      <ul id="bildirimListe" class="bildirim-liste" hidden></ul>
      <p id="bildirimGizli" class="bildirim-gizli" hidden></p>
    </section>
    <div id="sekmeler" class="sekmeler" hidden></div>

    <div id="paletKutusu" class="palet-kutusu">
      <input id="arama" class="arama" type="text" data-i18n-attr="placeholder:yuzey.arama.ipucu;aria-label:yuzey.arama.etiket" placeholder="Eylem ara…  (örn. “ışık 40”)" autocomplete="off" spellcheck="false" aria-label="Eylem ara" maxlength="60" role="combobox" aria-expanded="true" aria-controls="icerik" aria-autocomplete="list" aria-describedby="paletSerit">
    </div>

    <main id="icerik" class="icerik" tabindex="-1"></main>

    <div id="paletDurum" class="gorunmez" role="status" aria-live="polite"></div>

    <div id="ipucu" class="ipucu" role="status" aria-live="polite"></div>

    <div id="paletSerit" class="palet-serit" data-i18n="yuzey.paletSerit">Enter çalıştır · Shift+Enter seviye · Enter’ı basılı tut onay</div>

    <div id="gecikmeliSerit" class="gecikmeli-serit" role="group" data-i18n-attr="aria-label:yuzey.gecikmeli.baslik" aria-label="Zamanlı" hidden></div>

    <footer id="alt" class="alt">
      <button id="geriAl" class="alt-dugme alt-geri-al" type="button" data-i18n="yuzey.alt.geriAl" hidden>Geri al</button>
      <button id="haAc" class="alt-dugme" type="button" data-i18n="yuzey.alt.haAc">HA’yı aç</button>
      <button id="ayarlarAc" class="alt-dugme" type="button" data-i18n="yuzey.alt.ayarlar">Ayarlar</button>
    </footer>
  </div>
  <canvas id="efekt" class="efekt" aria-hidden="true" hidden></canvas>
  <script src="lib/dil.js"></script>
  <script src="lib/ceviri/yuzey.js"></script>
  <script src="lib/arama.js"></script>
  <script src="lib/kaydirici.js"></script>
  <script src="lib/ikon-seti.js"></script>
  <script src="yuzey-kartlar.js"></script>
  <script src="lib/bilgi-bicim.js"></script>
  <script src="lib/grafik.js"></script>
  <script src="yuzey-bilgi.js"></script>
  <script src="lib/karo-gorunum.js"></script>
  <script src="yuzey-duzen.js"></script>
  <script src="yuzey-kamera.js"></script>
  <script src="yuzey-eylem.js"></script>
  <script src="yuzey-sayfa.js"></script>
  <script src="yuzey-dis-onay.js"></script>
  <script src="lib/tema-renk.js"></script>
  <script src="lib/efekt.js"></script>
  <script src="yuzey-gorunum.js"></script>
</body>
</html>
